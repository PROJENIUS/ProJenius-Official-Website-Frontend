<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>You're offline | ProJenius Innovation Technology</title>
  <link rel="icon" type="image/svg+xml" href="/ProJenius_Logo.svg" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #071426; color: #fff; font-family: Inter, "Segoe UI", Arial, sans-serif; text-align: center; }
    main { max-width: 460px; }
    img { width: 72px; height: 72px; padding: 8px; border-radius: 50%; background: #fff; box-sizing: border-box; }
    h1 { margin: 22px 0 10px; font-size: 1.8rem; }
    p { margin: 0 0 12px; line-height: 1.6; color: rgba(255,255,255,.8); }
    button { margin-top: 12px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 12px; background: #20c8f5; color: #071426; font-family: inherit; font-size: 1rem; font-weight: 800; cursor: pointer; }
    .small { font-size: .9rem; color: rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <main>
    <img src="/ProJenius_Logo.svg" alt="ProJenius logo" />
    <h1>You're offline</h1>
    <p>Your internet connection dropped, so this page could not load. Nothing you typed was sent.</p>
    <p>Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="small">Need us now? Call +91 89254 50473</p>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
